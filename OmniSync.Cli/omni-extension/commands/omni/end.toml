description = "End the current Omni Assistant session"
prompt = '''
# /end — Session Close

## Phase 1: Review Session

- [ ] Read all checkpoints from current session log
- [ ] Identify key decisions and insights

## Phase 2: Synthesize

- [ ] Fill in session log sections:
  - Key Topics
  - Decisions Made
  - Action Items
  - Condense information from session quick log entries

## Phase 3: Commit

- [ ] Git add and commit everything, including the session log
- [ ] Message format: "Session XX: <brief summary>"

## Phase 4: Confirm

- [ ] Output: "✅ Session XX closed and committed."
'''
