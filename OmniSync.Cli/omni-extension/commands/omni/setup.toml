description = "Initialize Omni.Athena and OPC workspace"
prompt = '''
Initialize the Omni.Athena and Omni Project Context (OPC) workspace by scaffolding the required metadata directories.
Target Directories: .omni/athena/ and .omni/projectcontext/

Operation:
1. Ensure the directory '.omni/athena/' exists.
2. Run 'python -m athena init' in a way that creates the .agent, .framework, and .context directories inside '.omni/athena/'. This consolidates all Athena metadata away from the project root.
3. Initialize the Omni Project Context (OPC). Run 'python -m athena opc sync' to establish the initial project context tracking in '.omni/projectcontext/'.
4. Confirm to the user when both Athena and OPC structures are ready.
'''

