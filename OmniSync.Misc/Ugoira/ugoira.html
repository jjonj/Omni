<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ugoira downloader</title>
<style>
  :root { color-scheme: dark; font-family: system-ui,sans-serif; background: #12151d; color: #e8ecf5; }
  * { box-sizing: border-box; }
  body { width: 80%; margin: 0 auto; padding: 12px 0 24px; }
  .header { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-size: 22px; margin: 0; line-height: 1.2; }
  .source-choice { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
  .source-choice label { display: flex; gap: 6px; align-items: center; cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap; }
  input[type=radio] { margin: 0; accent-color: #a9caff; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  .source-input { margin: 0 0 8px; }
  #bookmark-name, #output, textarea { background: #1b2130; color: #e8ecf5; border: 1px solid #404c65; border-radius: 7px; font: 14px system-ui,sans-serif; padding: 9px 11px; }
  #bookmark-name { width: min(100%, 460px); }
  textarea { width: 100%; min-height: 88px; max-height: 220px; resize: vertical; font: 13px/1.4 ui-monospace,monospace; }
  textarea:focus, input:focus-visible { outline: 2px solid #80b5ff; outline-offset: 1px; }
  #file { display: block; margin-top: 5px; max-width: 100%; font-size: 12px; color: #aeb9d1; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
  #output { flex: 1 1 230px; min-width: 130px; }
  button { background: #a9caff; color: #10233f; border: 0; border-radius: 7px; padding: 9px 13px; font: 600 13px system-ui,sans-serif; min-height: 38px; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: #2b374e; color: #e8ecf5; border: 1px solid #51617d; }
  #bookmark-info, #cookie-status { color: #aeb9d1; font-size: 12px; margin: 4px 0; }
  #bookmark-info:empty, #cookie-status:empty, #error:empty { display: none; }
  #error { color: #ffaaa5; font-size: 13px; margin: 4px 0; }
  .batch-status { display: flex; align-items: center; gap: 14px; margin: 5px 0 10px; }
  #summary { font-size: 13px; font-weight: 600; flex: 0 1 auto; }
  progress { flex: 1; min-width: 60px; height: 7px; accent-color: #a9caff; }
  #results { display: grid; grid-template-columns: repeat(auto-fill,minmax(min(100%,290px),1fr)); gap: 12px; align-items: start; }
  .item { min-width: 0; padding: 12px; border: 1px solid #30394d; border-radius: 8px; background: #1b2130; }
  .top { display: flex; justify-content: space-between; gap: 12px; }
  .title { overflow-wrap: anywhere; }
  .status { flex-shrink: 0; font-weight: 600; }
  .detail { font-size: 13px; color: #aeb9d1; margin-top: 5px; overflow-wrap: anywhere; }
  a { color: #a9caff; margin-right: 12px; }
  .links { margin: 8px 0; }
  video { display: block; width: 100%; max-height: 280px; border-radius: 6px; background: #000; }
  #diag { font: 12px/1.5 ui-monospace,monospace; color: #8f9bb5; margin: 8px 0; overflow-wrap: anywhere; }
  details { margin: 12px 0 0; }
  details > summary { cursor: pointer; color: #a9caff; font-size: 12px; }
  #hublog { max-height: 320px; overflow: auto; background: #171c28; border: 1px solid #30394d; border-radius: 8px; padding: 12px; font: 12px/1.5 ui-monospace,monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: #c3ccdf; }
  [hidden] { display: none !important; }
  @media(max-width:700px) { body { width: 94%; } .header { gap: 10px; } }
</style>
</head>
<body>
<header class="header">
  <h1>Ugoira Downloader</h1>
  <div class="source-choice" role="group" aria-label="Download source">
    <label><input type="radio" name="source" value="links" checked> Links</label>
    <label><input type="radio" name="source" value="bookmarks"> Firefox bookmarks</label>
  </div>
</header>
<div id="links-mode" class="source-input">
  <label class="sr-only" for="urls">Pixiv artwork links</label>
  <textarea id="urls" placeholder="Pixiv artwork URLs, one per line" spellcheck="false"></textarea>
  <input id="file" type="file" accept=".txt,text/plain" aria-label="Load links from a text file">
</div>
<div id="bookmarks-mode" class="source-input" hidden>
  <label class="sr-only" for="bookmark-name">Firefox bookmark folder name</label>
  <input id="bookmark-name" type="text" placeholder="Firefox bookmark folder name" autocomplete="off">
  <div id="bookmark-info" role="status"></div>
</div>
<div class="toolbar">
  <label class="sr-only" for="output">Download folder on this PC</label>
  <input id="output" type="text" placeholder="Output folder">
  <button id="browse" type="button" class="secondary">Browse…</button>
  <button id="start" type="button">Download MP4s</button>
  <button id="update-cookies" class="secondary" type="button">Update cookies</button>
</div>
<div id="cookie-status" role="status"></div>
<div id="error" role="alert"></div>
<div class="batch-status">
  <span id="summary" role="status">Ready.</span>
  <progress id="progress" value="0" max="1" aria-label="Batch progress"></progress>
</div>
<div id="results"></div>
<details id="logpanel">
  <summary>Diagnostics / OmniHub log</summary>
  <p id="diag"></p>
  <pre id="hublog">Not loaded yet.</pre>
</details>

<script>
  const urls = document.querySelector('#urls');
  const sources = [...document.querySelectorAll('input[name="source"]')];
  const linksMode = document.querySelector('#links-mode');
  const bookmarksMode = document.querySelector('#bookmarks-mode');
  const bookmarkName = document.querySelector('#bookmark-name');
  const bookmarkInfo = document.querySelector('#bookmark-info');
  const usingBookmarks = () => sources.find(radio => radio.checked)?.value === 'bookmarks';
  function updateMode() { linksMode.hidden = usingBookmarks(); bookmarksMode.hidden = !usingBookmarks(); }
  sources.forEach(radio => radio.addEventListener('change', () => { updateMode(); error.textContent = ''; }));
  updateMode();
  const start = document.querySelector('#start');
  const file = document.querySelector('#file');
  const output = document.querySelector('#output');
  const browse = document.querySelector('#browse');
  const updateCookies = document.querySelector('#update-cookies');
  const cookieStatus = document.querySelector('#cookie-status');
  const error = document.querySelector('#error');
  const results = document.querySelector('#results');
  const summary = document.querySelector('#summary');
  const progress = document.querySelector('#progress');
  const diag = document.querySelector('#diag');
  const logpanel = document.querySelector('#logpanel');
  const hublog = document.querySelector('#hublog');
  const HUB_URL = 'http://127.0.0.1:3333/misc/ugoira/ugoira.html';
  const STATUS_URL = '/api/ugoira/status';
  let rows = [];
  let connectionLost = false;
  let choosingFolder = false;
  let lastJob = null;
  let lastPoll = 'starting...';
  function renderDiag() {
    const source = location.protocol === 'file:' ? 'opened from disk (file://)'
      : location.protocol === 'http:' || location.protocol === 'https:' ? 'served over http' : `protocol ${location.protocol}`;
    diag.textContent = `this page: ${location.origin || '(no origin)'} - ${source} - last /api/ugoira/status: ${lastPoll}`
      + (location.protocol === 'file:' ? ` - open ${HUB_URL} instead` : '');
  }
  renderDiag();
  async function loadHubLog() {
    if (!logpanel.open) return;
    try {
      const response = await fetch('/api/ugoira/log', {cache: 'no-store'});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      hublog.textContent = data.entries.length ? data.entries.join('\n') : 'OmniHub has logged nothing yet.';
      hublog.scrollTop = hublog.scrollHeight;
    } catch (e) { hublog.textContent = 'Could not read the OmniHub log: ' + e.message; }
  }
  logpanel.addEventListener('toggle', loadHubLog);
  updateCookies.addEventListener('click', async () => {
    updateCookies.disabled = true;
    cookieStatus.textContent = 'Reading current Pixiv cookies from Firefox Portable...';
    try {
      const response = await fetch('/api/ugoira/cookies/update', {method: 'POST'});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `Cookie refresh failed (HTTP ${response.status}).`);
      cookieStatus.textContent = data.message;
    } catch (e) { cookieStatus.textContent = 'Cookie refresh failed: ' + e.message; }
    finally { updateCookies.disabled = false; }
  });
  async function chooseFolder() {
    choosingFolder = true;
    browse.disabled = true;
    error.textContent = 'The folder picker is opening on the OmniHub PC...';
    try {
      const response = await fetch('/api/ugoira/folder', {method: 'POST', signal: AbortSignal.timeout(120000)});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Could not open the folder picker.');
      if (data.path) output.value = data.path;
      error.textContent = '';
      return Boolean(data.path);
    } catch (e) {
      error.textContent = e.name === 'TimeoutError'
        ? 'The folder picker has been open on the OmniHub PC for two minutes. Pick a folder in that window, or type the full path here.'
        : e.message;
      console.error('[Ugoira] Folder selection failed', e.message, {origin: location.origin});
      return false;
    } finally { choosingFolder = false; browse.disabled = false; }
  }
  browse.addEventListener('click', async () => {
    error.textContent = '';
    await chooseFolder();
  });
  file.addEventListener('change', async () => {
    try { if (file.files[0]) urls.value = await file.files[0].text(); }
    catch (e) { error.textContent = 'Could not read the selected file: ' + e.message; }
  });
  async function refresh() {
    const started = performance.now();
    const response = await fetch(STATUS_URL, {cache: 'no-store'});
    lastPoll = `HTTP ${response.status} in ${Math.round(performance.now() - started)}ms`;
    renderDiag();
    if (!response.ok) {
      let detail = '';
      try { detail = (await response.json()).error || ''; } catch (e) { detail = response.statusText || ''; }
      throw new Error(detail || `OmniHub answered HTTP ${response.status} for ${STATUS_URL}.`);
    }
    const state = await response.json();
    if (lastJob !== state.jobId) { console.info('[Ugoira] Job state', state.jobId, state.running ? 'running' : 'idle', state.summary); lastJob = state.jobId; }
    if (connectionLost) { error.textContent = ''; connectionLost = false; console.info('[Ugoira] Reconnected to OmniHub', state.jobId); }
    start.disabled = state.running || choosingFolder; file.disabled = state.running; urls.disabled = state.running;
    bookmarkName.disabled = state.running; sources.forEach(radio => { radio.disabled = state.running; });
    output.disabled = state.running || choosingFolder; browse.disabled = state.running || choosingFolder;
    if (!output.value && state.output) output.value = state.output;
    summary.textContent = state.summary;
    progress.max = Math.max(state.items.length, 1);
    progress.value = state.items.filter(item => ['Saved', 'Skipped', 'Failed'].includes(item.status)).length;
    if (rows.length !== state.items.length) { results.replaceChildren(); rows = []; }
    state.items.forEach((item, index) => {
      const serialized = JSON.stringify(item);
      if (rows[index]?.dataset.state === serialized) return;
      const row = document.createElement('div'); row.className = 'item'; row.dataset.state = serialized;
      const top = document.createElement('div'); top.className = 'top';
      const title = document.createElement('span'); title.className = 'title'; title.textContent = item.id ? 'Artwork ' + item.id : item.link;
      const status = document.createElement('span'); status.className = 'status'; status.textContent = item.status;
      if (item.status === 'Failed') status.style.color = '#ffaaa5';
      const detail = document.createElement('div'); detail.className = 'detail'; detail.textContent = item.detail;
      top.append(title, status); row.append(top, detail);
      if (item.video) {
        const links = document.createElement('div'); links.className = 'links';
        const save = document.createElement('a'); save.href = item.video; save.download = item.id + '.mp4'; save.textContent = 'Save MP4';
        links.append(save); row.append(links);
        const preview = document.createElement('video'); preview.src = item.video; preview.controls = true; preview.loop = true; preview.muted = true; preview.playsInline = true; preview.preload = 'metadata';
        preview.addEventListener('error', () => { detail.textContent = 'Browser could not play this video. Try saving the MP4 and opening it in another player.'; });
        row.append(preview);
      }
      if (rows[index]) rows[index].replaceWith(row); else results.append(row);
      rows[index] = row;
    });
  }
  start.addEventListener('click', async () => {
    error.textContent = ''; start.disabled = true;
    let links = urls.value;
    console.info('[Ugoira] Download clicked', {source: usingBookmarks() ? 'bookmarks' : 'links', output: output.value.trim(), origin: location.origin});
    try {
      if (usingBookmarks()) {
        if (!bookmarkName.value.trim()) throw new Error('Enter a Firefox bookmark folder name.');
        bookmarkInfo.textContent = 'Finding bookmarks in Firefox Portable...';
        const response = await fetch('/api/ugoira/bookmarks?folder=' + encodeURIComponent(bookmarkName.value.trim()), {cache: 'no-store'});
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `Bookmark lookup failed (HTTP ${response.status}).`);
        links = data.links.join('\n');
        bookmarkInfo.textContent = `${data.count} Pixiv artwork link(s) found. ${data.skippedNonPixiv} non-Pixiv bookmark(s) ignored.`;
      }
      if (!links.trim()) throw new Error('Paste at least one Pixiv artwork link.');
      if (!output.value.trim() && !await chooseFolder()) { start.disabled = false; return; }
      console.info('[Ugoira] Starting batch', {output: output.value});
      const response = await fetch('/api/ugoira/start', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: links, output: output.value.trim()})});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `OmniHub refused the batch (HTTP ${response.status}).`);
      console.info('[Ugoira] Batch accepted', data);
      await refresh();
    } catch (e) {
      error.textContent = e instanceof TypeError && location.protocol === 'file:' ? `This page cannot reach OmniHub. Open ${HUB_URL} in a browser.` : e.message;
      start.disabled = false;
      console.error('[Ugoira] Batch request failed', {origin: location.origin, lastPoll, message: e.message});
      renderDiag();
    }
    loadHubLog();
  });
  async function poll() {
    try { await refresh(); }
    catch (e) {
      const reason = e instanceof TypeError && location.protocol !== 'file:' ? `Network or CORS failure for ${STATUS_URL}: ${e.message}` : e.message;
      if (!connectionLost) console.error('[Ugoira] OmniHub unreachable', new Date().toISOString(), reason, {origin: location.origin, lastPoll});
      connectionLost = true;
      error.textContent = location.protocol === 'file:' ? `Opened from disk, so ${STATUS_URL} cannot resolve. Open ${HUB_URL} instead.` : `${reason} OmniHub is unavailable; retrying every second...`;
      renderDiag();
    }
    loadHubLog();
    setTimeout(poll, 1000);
  }
  poll();
</script>
</body>
</html>
