<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalR Test</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css?v=2026.01.22.17.10">
</head>
<body>
    <div class="app-layout">
        <!-- Navigation -->
        <nav class="nav-menu">
            <span class="nav-version" style="display:none;">2026.01.22.17.10</span>
        </nav>
        <script src="js/nav.js?v=2026.01.22.17.10"></script>
        
        <!-- Test Content -->
        <div class="test-container">
            <h1>Google Calendar Integration Test</h1>
        
            <div class="box">
                <p><strong>Target URL:</strong> <span id="target-url" style="color: var(--c-cal);">...</span></p>
                <button class="primary" onclick="fetchCalendar()">FETCH & PARSE</button>
                <div id="status">Ready.</div>
            </div>

            <div class="box">
                <h2>Events Found (Today & Future)</h2>
                <div id="events-list"></div>
            </div>

            <div class="box">
                <h2>System Tests</h2>
                <button class="modern-btn" onclick="runDevConsoleTest()">Run Dev Console Unit Test</button>
            </div>
        </div>
    </div>

    <script>
        // YOUR PUBLIC URL        const GCAL_URL = "https://calendar.google.com/calendar/ical/jjonjex%40gmail.com/public/basic.ics";
        
        // CORS PROXY (Necessary for local files to talk to Google)
        const PROXY_URL = "https://corsproxy.io/?";

        document.getElementById('target-url').innerText = GCAL_URL;

        async function fetchCalendar() {
            const status = document.getElementById('status');
            const list = document.getElementById('events-list');
            
            status.innerText = "Fetching via Proxy...";
            status.style.color = "var(--text-dim)";
            list.innerHTML = "";

            try {
                // 1. Fetch Raw Data
                const response = await fetch(PROXY_URL + encodeURIComponent(GCAL_URL));
                if (!response.ok) throw new Error("Network response failed");
                
                const icsData = await response.text();
                status.innerText = "Data received (" + icsData.length + " bytes). Parsing...";

                // 2. Parse ICS
                const events = parseICS(icsData);
                
                // 3. Render
                if (events.length === 0) {
                    list.innerHTML = "<div style='color:var(--c-work)'>No events found in file (or parsing failed).</div>";
                } else {
                    // Sort by time
                    events.sort((a,b) => a.start - b.start);

                    events.forEach(ev => {
                        const div = document.createElement('div');
                        div.className = 'event';
                        
                        // Format Time
                        const timeStr = ev.allDay                             ? "ALL DAY" 
                            : ev.start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                        div.innerHTML = `
                            <div class="time">${ev.start.toLocaleDateString()} <br> ${timeStr}</div>
                            <div>
                                <div class="title">${ev.summary}</div>
                                <div class="raw">${ev.description || ""}</div>
                            </div>
                        `;
                        list.appendChild(div);
                    });
                    status.innerText = `Success. Found ${events.length} upcoming events.`;
                    status.style.color = "var(--success)";
                }

            } catch (error) {
                console.error(error);
                status.innerText = "Error: " + error.message;
                status.style.color = "var(--danger)";
            }
        }

        // --- SIMPLE ICS PARSER ---
        function parseICS(data) {
            const events = [];
            const lines = data.split(/\r\n|\n|\r/);
            let inEvent = false;
            let currentEvent = {};
            
            const now = new Date();
            // Filter: Only show events from yesterday onwards (to catch ongoing)
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 1);

            lines.forEach(line => {
                if (line.startsWith("BEGIN:VEVENT")) {
                    inEvent = true;                    currentEvent = {};
                } else if (line.startsWith("END:VEVENT")) {
                    inEvent = false;
                    // Finish processing event
                    if (currentEvent.dtstart) {
                        const start = parseIcalDate(currentEvent.dtstart);
                        if (start > cutoff) {
                            events.push({
                                start: start,
                                summary: currentEvent.summary || "No Title",
                                description: currentEvent.description,
                                allDay: currentEvent.isAllDay
                            });
                        }
                    }
                } else if (inEvent) {
                    // Simple Key:Value splitting
                    // Note: This fails on multi-line descriptions, but works for PoC
                    if (line.startsWith("DTSTART")) {
                        currentEvent.dtstart = line.split(':')[1];
                        if (line.includes("VALUE=DATE")) currentEvent.isAllDay = true;
                    }
                    else if (line.startsWith("SUMMARY")) currentEvent.summary = line.substring(8);
                    else if (line.startsWith("DESCRIPTION")) currentEvent.description = line.substring(12);
                }
            });
            return events;
        }

        // Convert 20231124T090000Z to JS Date
        function parseIcalDate(icalStr) {
            // Handle YYYYMMDD (All Day)
            if (icalStr.length === 8) {
                const y = icalStr.substr(0,4);
                const m = icalStr.substr(4,2);
                const d = icalStr.substr(6,2);
                return new Date(`${y}-${m}-${d}T00:00:00`);
            }

            // Handle YYYYMMDDThhmmss            // Strip 'Z' if present (treating UTC as local for simplicity in PoC, or use real UTC parsing)
            const clean = icalStr.replace('Z', '');
            const y = clean.substr(0,4);
            const m = clean.substr(4,2);
            const d = clean.substr(6,2);
            const h = clean.substr(9,2);
            const min = clean.substr(11,2);
            const s = clean.substr(13,2);
            
            // Create date
            return new Date(`${y}-${m}-${d}T${h}:${min}:${s}`);
        }
    </script>
    <div id="dev-console" class="hidden">
        <div class="dev-console-header">
            <span class="dev-console-title">System Console</span>
            <button id="btn-clear-console">Clear</button>
        </div>
        <div id="console-output"></div>
    </div>
        <script src="js/dev-console.js?v=2026.01.22.17.10"></script>
        <script src="js/dev_console_test.js?v=2026.01.22.17.10"></script>
    </body>
    </html>
