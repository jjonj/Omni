<title>OmniZones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a monitor on a cutting mat. The screen is always "on" (dark); zones are amber layout tape. Controls sit beside it. */
:root {
  --bg: #e6e9ee;
  --panel: #f5f6f8;
  --ink: #161a22;
  --muted: #545c6b;
  --line: #cdd2da;
  --accent: #8f5208;
  --accent-soft: rgba(201, 122, 18, .14);
  --bezel: #1e2129;
  /* the screen world is fixed in both themes */
  --screen: #11141b;
  --tape: #f5a524;
  --tape-ink: #fbe3b4;
  --win: #1a1e26;
  --win-bar: #232833;
  --win-ink: #cfd5df;
  --win-dim: #7d8696;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1015; --panel: #171a21; --ink: #e5e8ed; --muted: #9aa2b1; --line: #2a2f3a;
    --accent: #f5a524; --accent-soft: rgba(245, 165, 36, .13); --bezel: #05060a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1015; --panel: #171a21; --ink: #e5e8ed; --muted: #9aa2b1; --line: #2a2f3a;
  --accent: #f5a524; --accent-soft: rgba(245, 165, 36, .13); --bezel: #05060a; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.page { padding-inline: 20px; padding-block: 18px 40px; max-width: 1760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; }
.mark { display: flex; align-items: baseline; gap: 12px; margin-right: auto; }
.mark h1 { margin: 0; font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 26px; letter-spacing: -.01em; }
.mark h1 span { color: var(--accent); }
.mark small { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 3px; background: var(--panel); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button kbd { font-family: var(--font-mono); font-size: 11px; opacity: .65; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* main grid */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 1100px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stagecol { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* monitor */
.bezel { background: var(--bezel); border-radius: 14px; padding: 10px 10px 14px; }
.monitor { position: relative; width: 100%; aspect-ratio: 3440 / 1440; background-color: var(--screen);
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: calc(100% / 34.4) calc(100% / 14.4); border-radius: 4px; overflow: hidden; container-type: inline-size; user-select: none; }
.monitor:focus-visible { outline-offset: 4px; }
.work { position: absolute; left: 0; top: 0; width: 100%; height: calc(1392 / 1440 * 100%); font-size: .5cqw; }
.chin { display: flex; justify-content: space-between; padding: 8px 4px 0; font-family: var(--font-mono); font-size: 11px; color: #8a93a3; }

.taskbar { position: absolute; left: 0; bottom: 0; width: 100%; height: calc(48 / 1440 * 100%); background: rgba(24, 27, 35, .96); border-top: 1px solid rgba(255,255,255,.06);
  display: flex; align-items: center; justify-content: center; gap: .5cqw; font-size: .5cqw; z-index: 5000; }
.taskbar button { height: 80%; aspect-ratio: 1; border: 0; border-radius: .5em; background: transparent; display: grid; place-items: center; cursor: pointer; position: relative; padding: 0; }
.taskbar button:hover { background: rgba(255,255,255,.08); }
.taskbar button.on::after { content: ""; position: absolute; bottom: 4%; width: 30%; height: 8%; border-radius: 2px; background: var(--tape); }
.taskbar .glyph { width: 60%; height: 60%; font-size: 1.1em; }

/* fake windows */
.win { position: absolute; background: var(--win); color: var(--win-ink); border: 1px solid rgba(255,255,255,.09); border-radius: .7em; overflow: hidden;
  display: flex; flex-direction: column; box-shadow: 0 .8em 2.4em rgba(0,0,0,.45);
  transition: left .22s cubic-bezier(.2,.8,.2,1), top .22s cubic-bezier(.2,.8,.2,1), width .22s cubic-bezier(.2,.8,.2,1), height .22s cubic-bezier(.2,.8,.2,1); }
.win.dragging { transition: none; opacity: .92; cursor: grabbing; }
.win.focused { border-color: rgba(255,255,255,.28); }
.win.attn { box-shadow: 0 0 0 .35em var(--tape), 0 .8em 2.4em rgba(0,0,0,.45); animation: attn 1.1s ease-in-out infinite; }
@keyframes attn { 50% { box-shadow: 0 0 0 .7em rgba(245,165,36,.25), 0 .8em 2.4em rgba(0,0,0,.45); } }
.bar { flex: none; height: 3em; display: flex; align-items: center; gap: .7em; padding: 0 .9em; background: var(--win-bar); cursor: grab; touch-action: none; white-space: nowrap; font-size: 1.15em; }
.bar .t { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.bar .ctl { display: flex; gap: 1.1em; color: var(--win-dim); }
.bar .ctl i { width: .8em; height: .8em; border: 1px solid currentColor; border-radius: 1px; display: block; }
.bar .ctl i:first-child { height: 0; border-width: 1px 0 0; align-self: center; }
.glyph { width: 1.6em; height: 1.6em; border-radius: .35em; display: grid; place-items: center; font: 700 .8em/1 var(--font-mono); color: #fff; flex: none; }
.body { flex: 1; min-height: 0; overflow: hidden; position: relative; font-size: 1.05em; }

.sk { height: .7em; border-radius: .35em; background: rgba(255,255,255,.08); }
.term { margin: 0; padding: .8em 1em; font: 1em/1.55 var(--font-mono); color: #b9c2cf; white-space: pre-wrap; word-break: break-all; }
.term b { color: var(--tape); font-weight: 500; }
.term .ok { color: #7fd1a3; }
.term .ask { display: inline-block; margin-top: .4em; padding: .3em .6em; border: 1px solid rgba(245,165,36,.6); border-radius: .3em; color: var(--tape-ink); }

.ff-tabs { display: flex; gap: .3em; padding: .4em .6em 0; background: #20242d; }
.ff-tabs span { padding: .45em .9em; border-radius: .45em .45em 0 0; color: var(--win-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16em; }
.ff-tabs span.on { background: #2b303b; color: var(--win-ink); }
.ff-url { margin: 0; padding: .5em .8em; background: #2b303b; font-family: var(--font-mono); color: var(--win-dim); border-bottom: 1px solid rgba(255,255,255,.06); }
.ff-page { padding: 1.6em 2em; display: flex; flex-direction: column; gap: 1.2em; }
.ff-page h3 { margin: 0; font: 600 2em/1.1 var(--font-body); color: #e7ebf1; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(12em, 1fr)); gap: .9em; }
.cards div { background: #232833; border-radius: .6em; padding: .9em 1em; display: flex; flex-direction: column; gap: .5em; }
.cards b { font-weight: 600; color: #e7ebf1; }
.cards small { color: var(--win-dim); }

.dc { display: grid; grid-template-columns: 4.2em 13em minmax(0, 1fr) 13em; height: 100%; }
.dc .rail { background: #15181e; display: flex; flex-direction: column; align-items: center; gap: .6em; padding: .7em 0; }
.dc .rail i { width: 2.8em; height: 2.8em; border-radius: 50%; background: #2b303b; }
.dc .chans, .dc .mem { background: #1c2028; padding: .9em; display: flex; flex-direction: column; gap: .7em; color: var(--win-dim); }
.dc .chat { padding: .9em 1.1em; display: flex; flex-direction: column; gap: 1em; }
.dc .msg { display: grid; grid-template-columns: 2.4em 1fr; gap: .2em .7em; }
.dc .msg i { grid-row: span 2; width: 2.4em; height: 2.4em; border-radius: 50%; background: #343a47; }
.dc .mem .who { display: flex; align-items: center; gap: .6em; }
.dc .mem .who i { width: 1.8em; height: 1.8em; border-radius: 50%; background: #343a47; position: relative; }
.dc .mem .who i::after { content: ""; position: absolute; right: -.1em; bottom: -.1em; width: .7em; height: .7em; border-radius: 50%; background: #3ba55d; border: .15em solid #1c2028; }

.ob { display: grid; grid-template-columns: 14em minmax(0, 1fr); height: 100%; }
.ob .tree { background: #1d1f26; padding: .9em; display: flex; flex-direction: column; gap: .45em; color: var(--win-dim); }
.ob .tree .on { color: #e7ebf1; background: #2b2f3a; border-radius: .3em; padding: 0 .4em; }
.ob .doc { padding: 1.4em 1.8em; display: flex; flex-direction: column; gap: .55em; }
.ob .doc h4 { margin: 0 0 .3em; font: 600 1.8em/1.1 var(--font-body); color: #e7ebf1; }
.ob .doc p { margin: 0; color: #b9c2cf; }

.fo-path { padding: .55em .9em; font-family: var(--font-mono); background: #20242d; color: var(--win-ink); border-bottom: 1px solid rgba(255,255,255,.06); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fo-list { list-style: none; margin: 0; padding: .4em; display: flex; flex-direction: column; }
.fo-list li { display: flex; align-items: center; gap: .7em; padding: .35em .5em; border-radius: .35em; }
.fo-list li:hover { background: #232833; }
.fo-list li span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fo-list svg { width: 1.3em; height: 1.3em; flex: none; }
.fo-list button { border: 1px solid rgba(245,165,36,.55); background: rgba(245,165,36,.1); color: var(--tape-ink); border-radius: .35em; font: 500 .9em var(--font-mono); padding: .25em .6em; cursor: pointer; white-space: nowrap; }
.fo-list button:hover { background: rgba(245,165,36,.25); }

/* zone overlay */
.overlay { position: absolute; inset: 0; z-index: 4000; pointer-events: none; }
.overlay.off { display: none; }
.oz { position: absolute; border: .2em solid rgba(245,165,36,.55); background: rgba(245,165,36,.07); border-radius: .7em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5em;
  text-align: center; color: var(--tape-ink); padding: 1em; transition: background .12s; }
.oz.hot { background: rgba(245,165,36,.26); border-color: var(--tape); }
.oz.scene { border-style: dashed; }
.oz.pickable { pointer-events: auto; cursor: pointer; }
.oz.pickable:hover { background: rgba(245,165,36,.26); border-color: var(--tape); }
.oz .n { font: 700 2.3em/1.05 var(--font-display); font-stretch: 112%; }
.oz .k { font: 500 1.25em/1.3 var(--font-mono); opacity: .85; }
.oz .a { font: 600 1.45em/1.2 var(--font-body); background: var(--tape); color: #1b1305; padding: .3em .8em; border-radius: .4em; }
.oz.peek { border-left-width: 0; border-radius: 0 .7em .7em 0; }

.toast { position: absolute; left: 50%; bottom: calc(48 / 1440 * 100% + 1.4cqw); transform: translateX(-50%); z-index: 4500; background: #f4f1ea; color: #15171c;
  border-radius: .6cqw; padding: .55cqw .9cqw; font-size: max(11px, .78cqw); display: flex; gap: .8cqw; align-items: center; box-shadow: 0 .5cqw 1.5cqw rgba(0,0,0,.5); max-width: 80%; }
.toast button { border: 0; background: #15171c; color: #f4f1ea; border-radius: .4cqw; padding: .3cqw .7cqw; cursor: pointer; font-weight: 600; white-space: nowrap; }

/* editor */
.edit-layer { position: absolute; inset: 0; z-index: 4200; }
.monitor.editing .win { opacity: .16; pointer-events: none; filter: grayscale(.6); }
.ez { position: absolute; border: .2em solid rgba(245,165,36,.6); background: rgba(245,165,36,.09); border-radius: .5em; cursor: move; touch-action: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4em; color: var(--tape-ink); text-align: center; padding: .6em; }
.ez.sel { background: rgba(245,165,36,.22); border-color: var(--tape); z-index: 2; }
.ez .n { font: 700 2.1em/1.05 var(--font-display); font-stretch: 112%; }
.ez .d { font: 500 1.3em var(--font-mono); font-variant-numeric: tabular-nums; }
.ez .k { font: 500 1.15em var(--font-mono); opacity: .8; }
.ez.peek { cursor: default; border-left-style: dashed; }
.ez .off { position: absolute; left: .6em; top: 50%; transform: translateY(-50%); font: 500 1.1em var(--font-mono); writing-mode: vertical-rl; rotate: 180deg; opacity: .75; }
.h { position: absolute; width: 1.6em; height: 1.6em; background: var(--tape); border: .25em solid #1b1305; border-radius: 50%; }
.h[data-h="n"] { top: -.8em; left: calc(50% - .8em); cursor: ns-resize; }
.h[data-h="s"] { bottom: -.8em; left: calc(50% - .8em); cursor: ns-resize; }
.h[data-h="e"] { right: -.8em; top: calc(50% - .8em); cursor: ew-resize; }
.h[data-h="w"] { left: -.8em; top: calc(50% - .8em); cursor: ew-resize; }
.h[data-h="ne"] { right: -.8em; top: -.8em; cursor: nesw-resize; }
.h[data-h="nw"] { left: -.8em; top: -.8em; cursor: nwse-resize; }
.h[data-h="se"] { right: -.8em; bottom: -.8em; cursor: nwse-resize; }
.h[data-h="sw"] { left: -.8em; bottom: -.8em; cursor: nesw-resize; }

/* hotkey deck */
.deck { display: flex; flex-wrap: wrap; gap: 14px 22px; }
.deck .grp { display: flex; flex-direction: column; gap: 6px; }
.deck .row { display: flex; flex-wrap: wrap; gap: 6px; }
.hk { display: inline-flex; align-items: center; gap: 4px; padding: 6px 9px 6px 6px; min-height: 40px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; cursor: pointer; font-size: 13px; }
.hk:hover { border-color: var(--accent); }
.hk span { margin-left: 4px; }
kbd { font-family: var(--font-mono); font-size: 11.5px; padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--bg); line-height: 1.3; }
.hint { margin: 0; color: var(--muted); font-size: 13px; max-width: 110ch; }

/* side panel */
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.side section { display: flex; flex-direction: column; gap: 10px; }
.side h2 { margin: 0; font: 700 15px/1.2 var(--font-display); font-stretch: 112%; }
.try { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.try button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 44px; }
.try button:hover { border-color: var(--accent); }
.try button b { font-weight: 600; font-size: 13px; }
.try button small { color: var(--muted); font-size: 12px; line-height: 1.3; }
.rule { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; cursor: pointer; }
.rule input { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; cursor: pointer; margin: 1px 0 0; transition: background .15s; }
.rule input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: left .15s; }
.rule input:checked { background: var(--accent); }
.rule input:checked::after { left: 17px; }
.rule span { font-size: 13px; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.log li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; color: var(--muted); }
.log li:first-child { color: var(--ink); }
.log time { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; padding-top: 1px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field input[type="text"], .field input[type="number"] { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); width: 100%; min-height: 36px; }
.field input[type="range"] { width: 100%; accent-color: var(--accent); }
.geo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.geo input { font-family: var(--font-mono) !important; font-variant-numeric: tabular-nums; padding: 7px 6px !important; }
.zlist { display: flex; flex-direction: column; gap: 4px; }
.zlist button { display: flex; justify-content: space-between; gap: 8px; border: 1px solid transparent; background: none; padding: 7px 9px; border-radius: 7px; cursor: pointer; text-align: left; min-height: 36px; }
.zlist button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.zlist small { font-family: var(--font-mono); color: var(--muted); font-size: 11.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; min-height: 32px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 7px 11px; cursor: pointer; font-size: 13px; min-height: 36px; }
.btn:hover { border-color: var(--accent); }
.btn.danger:hover { border-color: #c2412d; color: #c2412d; }
.note { margin: 0; font-size: 12.5px; color: var(--muted); }
.note b { color: var(--ink); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  .win { transition: none; }
  .win.attn { animation: none; }
}
</style>

<div class="page">
  <header class="top">
    <div class="mark"><h1>Omni<span>Zones</span></h1><small>Primary · 3440 × 1440 · 21:9</small></div>
    <div class="seg" role="group" aria-label="Mode" id="modeSeg">
      <button type="button" data-mode="sim" aria-pressed="true">Simulate</button>
      <button type="button" data-mode="edit" aria-pressed="false">Edit zones</button>
    </div>
    <div class="seg" role="group" aria-label="Layout" id="layoutSeg"></div>
  </header>

  <div class="main">
    <div class="stagecol">
      <div class="bezel">
        <div class="monitor" id="monitor" tabindex="0" aria-label="Simulated 21:9 monitor. Arrow keys act as Win plus arrow.">
          <div class="work" id="work">
            <div class="overlay off" id="overlay"></div>
            <div class="edit-layer" id="editLayer" hidden></div>
          </div>
          <div class="taskbar" id="taskbar"></div>
          <div class="toast" id="toast" hidden></div>
        </div>
        <div class="chin"><span>Monitor 1 · work area 3440 × 1392</span><span>Monitor 2 is to the right →</span></div>
      </div>
      <div class="deck" id="deck">
        <div class="grp"><span class="label">Move · replaces Windows Snap</span><div class="row">
          <button class="hk" type="button" data-hk="left"><kbd>Win</kbd><kbd>←</kbd><span>Zone left</span></button>
          <button class="hk" type="button" data-hk="right"><kbd>Win</kbd><kbd>→</kbd><span>Zone right</span></button>
          <button class="hk" type="button" data-hk="up"><kbd>Win</kbd><kbd>↑</kbd><span>Fill screen</span></button>
          <button class="hk" type="button" data-hk="down"><kbd>Win</kbd><kbd>↓</kbd><span>Unsnap</span></button>
        </div></div>
        <div class="grp"><span class="label">Stacks &amp; peek</span><div class="row">
          <button class="hk" type="button" data-hk="cycle"><kbd>Win</kbd><kbd>Alt</kbd><kbd>↓</kbd><span>Next in stack</span></button>
          <button class="hk" type="button" data-hk="peek"><kbd>Win</kbd><kbd>`</kbd><span>Peek</span></button>
        </div></div>
        <div class="grp"><span class="label">Arrange</span><div class="row">
          <button class="hk" type="button" data-hk="gather"><kbd>Win</kbd><kbd>Alt</kbd><kbd>T</kbd><span>Gather terminals</span></button>
          <button class="hk" type="button" data-hk="undo"><kbd>Win</kbd><kbd>Ctrl</kbd><kbd>Z</kbd><span>Undo</span></button>
        </div></div>
      </div>
      <p class="hint" id="hint"></p>
    </div>
    <aside class="side" id="side" aria-live="polite"></aside>
  </div>
</div>

<script>
(() => {
/* =====================================================================
   OmniZones core: pure zone math. No DOM, no globals, no app state.
   This block is the portable part (to the Hub in C#, or a standalone app).
   Units are screen pixels of one monitor's work area.
   layout  = { id, gap, zones: [{ id, name, kind: 'zone'|'stack'|'peek', x, y, w, h, apps[],
               stack?: 'rows'|'accordion', visible?, winW? }] }
   window  = { id, app, zone: zoneId|null, stackOrder, homes?: { [layoutId]: zoneId } }
   ===================================================================== */
const OmniZones = (() => {
  const members = (windows, zid) => windows.filter((w) => w.zone === zid).sort((a, b) => a.stackOrder - b.stackOrder);

  /** Effective rect per zone. An occupied peek dock reserves its visible sliver and zones it overlaps shrink. */
  function zoneRects(layout, windows, screen) {
    const R = {};
    for (const z of layout.zones) R[z.id] = z.kind === 'peek' ? { x: 0, y: z.y, w: z.visible, h: z.h } : { x: z.x, y: z.y, w: z.w, h: z.h };
    for (const p of layout.zones.filter((z) => z.kind === 'peek')) {
      if (!members(windows, p.id).length) continue;
      for (const z of layout.zones) {
        if (z.kind === 'peek') continue;
        const r = R[z.id];
        if (r.y < p.y + p.h && r.y + r.h > p.y && r.x < p.visible) { const cut = p.visible - r.x; r.x += cut; r.w -= cut; }
      }
    }
    return R;
  }

  /** Shrink a zone rect by the layout gap: half a gap between zones, a full gap at screen edges. */
  function inset(r, g, screen) {
    if (!g) return { ...r };
    const l = r.x + (r.x <= 0 ? g : g / 2), t = r.y + (r.y <= 0 ? g : g / 2);
    const rr = r.x + r.w - (r.x + r.w >= screen.w ? g : g / 2), b = r.y + r.h - (r.y + r.h >= screen.h ? g : g / 2);
    return { x: l, y: t, w: rr - l, h: b - t };
  }

  /** Where a zoned window goes. ctx = { layout, windows, screen, rects, stackActive, peekOpen }. Null if its zone is gone. */
  function windowRect(w, ctx) {
    const { layout, windows, screen, rects, stackActive = {}, peekOpen = null } = ctx;
    const z = layout.zones.find((q) => q.id === w.zone);
    if (!z) return null;
    const g = layout.gap;
    if (z.kind === 'peek') {
      return { x: peekOpen === w.id ? g : -(z.winW - z.visible), y: z.y + g, w: z.winW, h: z.h - 2 * g };
    }
    const inner = inset(rects[z.id], g, screen);
    if (z.kind === 'zone') return inner;
    const ms = members(windows, z.id), n = ms.length, i = ms.indexOf(w);
    if (z.stack === 'rows') { const h = (inner.h - (n - 1) * g) / n; return { x: inner.x, y: inner.y + i * (h + g), w: inner.w, h }; }
    const active = ms.find((m) => m.id === stackActive[z.id]) || ms[0];
    const col = Math.min(150, inner.h / n), big = inner.h - (n - 1) * (col + g);
    let y = inner.y;
    for (const m of ms) { const h = m === active ? big : col; if (m === w) return { x: inner.x, y, w: inner.w, h }; y += h + g; }
    return inner;
  }

  /** Zone under a point. Peek docks win over the zones they sit on. */
  function zoneAt(layout, rects, p) {
    const inside = (r) => p.x >= r.x && p.x < r.x + r.w && p.y >= r.y && p.y < r.y + r.h;
    const peeks = layout.zones.filter((z) => z.kind === 'peek'), rest = layout.zones.filter((z) => z.kind !== 'peek').reverse();
    return [...peeks, ...rest].find((z) => inside(rects[z.id])) || null;
  }

  /** Nearest zone left or right of a point (Win+arrow). Vertical distance counts double. */
  function neighbor(layout, rects, from, dir, excludeId) {
    let best = null, bs = Infinity;
    for (const z of layout.zones) {
      if (z.id === excludeId) continue;
      const r = rects[z.id], dx = r.x + r.w / 2 - from.x, dy = r.y + r.h / 2 - from.y;
      if (dir === 'left' ? dx > -1 : dx < 1) continue;
      const s = Math.abs(dx) + 2 * Math.abs(dy);
      if (s < bs) { bs = s; best = z; }
    }
    return best;
  }

  /** Assign windows to a layout: remembered zone first, then the first free zone that prefers the app. Map id -> zoneId|null. */
  function plan(layout, windows) {
    const out = new Map(), taken = new Set();
    const free = (z) => z.kind === 'stack' || !taken.has(z.id);
    const ordered = [...windows].sort((a, b) => (b.homes && b.homes[layout.id] ? 1 : 0) - (a.homes && a.homes[layout.id] ? 1 : 0));
    for (const w of ordered) {
      const homeId = w.homes && w.homes[layout.id], home = homeId && layout.zones.find((z) => z.id === homeId);
      const t = home && free(home) ? home : layout.zones.find((z) => z.apps.includes(w.app) && free(z));
      out.set(w.id, t ? t.id : null);
      if (t) taken.add(t.id);
    }
    return out;
  }

  return { members, zoneRects, inset, windowRect, zoneAt, neighbor, plan };
})();

$('#deck').addEventListener('click', (e) => { const b = e.target.closest('[data-hk]'); if (b) hotkey(b.dataset.hk); });
function hotkey(k) {
  if (k === 'left' || k === 'right' || k === 'up' || k === 'down') winArrow(k);
  else if (k === 'cycle') cycleStack(1);
  else if (k === 'cycleUp') cycleStack(-1);
  else if (k === 'peek') togglePeek();
  else if (k === 'gather') gather();
  else if (k === 'undo') undo();
}
$('#taskbar').addEventListener('click', (e) => {
  const b = e.target.closest('[data-id]'); if (!b || S.mode !== 'sim') return;
  const w = win(b.dataset.id), z = zoneById(w.zone);
  if (z && z.kind === 'peek') { S.peekOpen = S.peekOpen === w.id ? null : w.id; }
  focusWin(w); syncWindows(); renderTaskbar();
});
$('#monitor').addEventListener('keydown', (e) => {
  if (S.mode !== 'sim') return;
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); hotkey(e.key === 'ArrowDown' ? 'cycle' : 'cycleUp'); return; }
  if (map[e.key]) { e.preventDefault(); hotkey(map[e.key]); return; }
  const k = e.key.toLowerCase();
  if (k === 't') hotkey('gather');
  else if (k === 'z') hotkey('undo');
  else if (k === '`') hotkey('peek');
  else if (k === 'escape' && S.pick) { S.pick = null; hideToast(); renderOverlay(); }
  else { const l = S.layouts.find((q) => q.key === k); if (l) applyLayout(l.id); }
});
$('#overlay').addEventListener('click', (e) => { const oz = e.target.closest('.oz'); if (oz && S.pick) spawnTerminal(zoneById(oz.dataset.z)); });
$('#editLayer').addEventListener('pointerdown', onEditDown);
$('#side').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  const L = layout(), z = L.zones.find((q) => q.id === S.sel[L.id]);
  if (t.dataset.act === 'agent') agentNeedsInput();
  else if (t.dataset.act === 'gather') gather();
  else if (t.dataset.act === 'scatter') scatter();
  else if (t.dataset.act === 'drag-ob') demoDragObsidian();
  else if (t.dataset.sel) { S.sel[L.id] = t.dataset.sel; render(); }
  else if (t.dataset.za) zoneAction(t.dataset.za);
  else if (t.dataset.kind && z) {
    const k = t.dataset.kind;
    if (k === 'peek' && L.zones.some((q) => q.kind === 'peek' && q !== z)) { toast('This layout already has a peek zone.'); return; }
    if (k === 'peek') Object.assign(z, { visible: 300, winW: 1100, x: 0, w: 300 });
    if (z.kind === 'peek' && k !== 'peek') Object.assign(z, { x: 0, w: Math.max(z.visible, 600) });
    if (k === 'stack' && !z.stack) z.stack = 'rows';
    z.kind = k; render();
  }
  else if (t.dataset.stack && z) { z.stack = t.dataset.stack; render(); }
  else if (t.dataset.app && z) { const a = t.dataset.app; z.apps = z.apps.includes(a) ? z.apps.filter((x) => x !== a) : [...z.apps, a]; render(); }
});
$('#side').addEventListener('input', (e) => {
  const t = e.target, L = layout(), z = L.zones.find((q) => q.id === S.sel[L.id]);
  if (t.dataset.rule) { S.rules[t.dataset.rule] = t.checked; log(`Rule ${t.checked ? 'on' : 'off'}: ${t.nextElementSibling.textContent}`); return; }
  if (t.id === 'layName') { L.name = t.value || L.name; renderHeader(); return; }
  if (t.id === 'layGap') { L.gap = +t.value; t.previousElementSibling.textContent = `Gap between zones · ${L.gap} px`; syncWindows(); return; }
  if (!z) return;
  if (t.id === 'zName') { z.name = t.value; renderEditor(); return; }
  if (t.id === 'zVis') { z.visible = +t.value; z.w = z.visible; t.previousElementSibling.textContent = `Visible part · ${z.visible} px`; renderEditor(); return; }
  if (t.id === 'zWinW') { z.winW = clamp(+t.value || 1100, 400, 3000); z.visible = Math.min(z.visible, z.winW - 100); renderEditor(); return; }
  if (t.dataset.geo) {
    const k = t.dataset.geo, v = +t.value; if (!Number.isFinite(v)) return;
    if (k === 'x') z.x = clamp(v, 0, W - z.w); if (k === 'y') z.y = clamp(v, 0, H - z.h);
    if (k === 'w') z.w = clamp(v, EZ_MIN, W - z.x); if (k === 'h') z.h = clamp(v, EZ_MIN, H - z.y);
    renderEditor();
  }
});
$('#side').addEventListener('change', (e) => { if (e.target.dataset.geo || e.target.id === 'zName') renderSide(); });

/* Animated demo: carries Obsidian along a path so the rule can be seen without dragging. */
function demoDragObsidian() {
  if (S.drag) return;
  const w = win('ob'); if (!w) return;
  if (S.layoutId === 'writing') { toast('Already in the Writing scene. Undo or pick another layout first.'); return; }
  const target = layout().zones.find(sceneTarget);
  if (!target) { toast(`${layout().name} has no main stage for the scene rule.`); return; }
  focusWin(w);
  const r = geom(w), startP = { x: r.x + r.w / 2, y: r.y + 40 }, R = effRects()[target.id];
  const endP = { x: R.x + R.w / 2, y: R.y + R.h / 2 };
  S.drag = { id: w.id, start: startP, off: { x: r.w / 2, y: 40 }, rect: r, fromZone: w.zone, moved: false, hot: null, free: false };
  const t0 = performance.now(), dur = 1300;
  const fakeAt = (p) => { const b = $('#work').getBoundingClientRect(); return { clientX: b.left + p.x / W * b.width, clientY: b.top + p.y / H * b.height, shiftKey: false }; };
  onDragMove(fakeAt({ x: startP.x + 40, y: startP.y + 30 }));
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur), e2 = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    onDragMove(fakeAt({ x: startP.x + (endP.x - startP.x) * e2, y: startP.y + (endP.y - startP.y) * e2 }));
    if (k < 1) requestAnimationFrame(step); else setTimeout(onDragUp, 650);
  };
  requestAnimationFrame(step);
}

render();
})();
</script>
