<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmniDesign — round 3 prototype (desktop + Android)</title>
<!--
  OmniDesign R3 prototype (MISC-0160 / MISC-0161).
  One responsive app: <= 760px wide renders the Android UI, wider renders the desktop editor.
  Diagrams render exactly in the architecture-diagram skill style (1200x700 SVG figure, solid ivory vs dashed amber).
  Screenshot scenarios: add #s=<name> to the URL (lib, ed:<docId>, sel, shapes, edge, offline, conflict,
  agent, diff, share, history, new, sheet, outline, export). Everything is simulated locally; no network.
-->
<style>
:root{--desk:#0e0f12;--chrome:#16181c;--panel:#1b1d22;--raise:#22252b;--line:#2a2d33;--line2:#383b42;--fg:#e6e2d8;--muted:#a09a8c;--acc:#e0a458;--accbg:#2c241a;--accln:#5c4627;--ok:#9fb59a;--bad:#d48a7e;--paper:#14161a;--box:#1d2026;--selc:#f4f1ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--desk);color:var(--fg);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--fg);background:var(--paper);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:60px;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--muted)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mut{color:var(--muted)} .acc{color:var(--acc)} .sp{flex:1}
#app{display:flex;flex-direction:column;height:100%}
/* top bar */
.top{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;background:var(--chrome);border-bottom:1px solid var(--line);position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;padding:0 8px 0 4px;white-space:nowrap}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:7px;color:var(--muted);flex:none}
.ib:hover{background:var(--raise);color:var(--fg)} .ib.on{background:var(--raise);color:var(--fg)}
.ib.sm{width:28px;height:28px}
.btn{height:32px;padding:0 12px;border-radius:7px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);color:var(--fg);white-space:nowrap;flex:none}
.btn:hover{background:var(--raise)} .btn.pri{background:var(--fg);color:#16181c;border-color:var(--fg);font-weight:600} .btn.pri:hover{background:#fff}
.btn.accb{background:var(--acc);color:#1d1408;border-color:var(--acc);font-weight:600}
.btn.ghost{border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--fg)}
.btn.sm{height:28px;padding:0 10px;font-size:13px} .btn.danger{color:var(--bad)}
.ttl{display:flex;align-items:baseline;gap:10px;min-width:0;padding-left:4px}
.ttl input{background:transparent;border-color:transparent;font-size:15px;font-weight:600;width:auto;min-width:120px;max-width:420px;padding:5px 8px;field-sizing:content}
.ttl input:hover{border-color:var(--line2)} .ttl input:focus{border-color:var(--muted);background:var(--paper)}
.ttl .mut{font-size:13px;white-space:nowrap}
.vsep{width:1px;height:22px;background:var(--line);margin:0 4px}
/* sync chip */
.chip{height:28px;display:inline-flex;align-items:center;gap:7px;padding:0 11px 0 9px;border-radius:99px;border:1px solid var(--line2);font-size:13px;color:var(--muted);white-space:nowrap;flex:none}
.chip:hover{color:var(--fg)} .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip.off,.chip.rev{color:var(--acc);border-color:var(--accln);background:var(--accbg)}
.chip svg.i{width:15px;height:15px}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--line2);border-top-color:var(--fg);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.obar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--accbg);border-bottom:1px solid var(--accln);color:var(--acc);font-size:13px}
.obar span{color:#e9d2b0} .obar button{margin-left:auto;color:var(--acc);font-weight:600}
/* library (desktop) */
.lib{flex:1;display:flex;min-height:0}
.nav{width:228px;flex:none;padding:14px 10px;border-right:1px solid var(--line);background:var(--chrome);overflow:auto}
.nav a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;color:var(--muted);cursor:pointer;font-size:14px}
.nav a:hover{color:var(--fg)} .nav a.on{background:var(--raise);color:var(--fg)} .nav a .n{margin-left:auto;font-size:12px}
.nav h5{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:18px 10px 6px;font-weight:600}
.libmain{flex:1;overflow:auto;padding:24px 30px 40px}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.lhead h2{margin:0;font-size:22px;font-weight:600} .lhead .mut{font-size:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line2);border-radius:8px;padding:0 10px;height:34px;width:300px;color:var(--muted)}
.search input{border:0;background:transparent;padding:0;height:100%}
.waiting{display:flex;gap:10px;align-items:center;margin:0 0 18px;padding:10px 14px;border:1px solid var(--accln);background:var(--accbg);border-radius:10px;color:#e9d2b0;font-size:13px}
.waiting svg{color:var(--acc)} .waiting a{color:var(--acc);font-weight:600;cursor:pointer;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .12s,transform .12s}
.card:hover{border-color:#4a4d55}
.thumb{background:var(--paper);aspect-ratio:12/7.4;border-bottom:1px solid var(--line);padding:10px 12px;display:grid;place-items:center}
.thumb svg{width:100%;height:auto;display:block}
.cbody{padding:11px 12px 10px} .cttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfoot{display:flex;align-items:center;gap:6px;margin-top:9px}
.badge{font-size:12px;height:22px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.badge.a{color:var(--acc);border-color:var(--accln);background:var(--accbg)} .badge svg.i{width:13px;height:13px}
.cfoot .ib{margin-left:auto}
/* editor */
.ed{flex:1;display:flex;min-height:0;position:relative}
.stage{flex:1;position:relative;overflow:hidden;background:var(--desk) radial-gradient(circle,#23262c 1px,transparent 1.3px) 0 0/22px 22px;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.panning{cursor:grabbing} .stage.hand{cursor:grab} .stage.conn{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.paper{width:1256px;background:var(--paper);padding:24px 28px 22px;border-radius:3px;box-shadow:0 0 0 1px #262930,0 24px 60px rgba(0,0,0,.5)}
.paper h1{font-size:22px;margin:0 0 4px;font-weight:600;cursor:text} .paper .sub{margin:0 0 14px;color:var(--muted);font-size:14px;cursor:text}
.paper svg.doc{width:1200px;height:700px;display:block}
.paper .cap{color:var(--muted);font-size:14px;margin:10px 0 0;line-height:1.45;cursor:text;min-height:20px}
.nd{cursor:default} .stage.conn .nd{cursor:crosshair}
.rail{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:5px;background:var(--chrome);border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:4}
.rail .ib{width:36px;height:36px;position:relative} .rail .sep{height:1px;background:var(--line);margin:4px 3px}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:46px;top:50%;transform:translateY(-50%);background:#0b0c0e;color:var(--fg);border:1px solid var(--line2);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:9}
.flyout{position:absolute;left:62px;top:50%;transform:translateY(-50%);width:304px;max-height:calc(100% - 40px);display:flex;flex-direction:column;background:var(--chrome);border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:6}
.flyout .fh{padding:12px 12px 8px;display:flex;flex-direction:column;gap:9px}
.flyout .fb{overflow:auto;padding:0 12px 12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);cursor:grab;touch-action:none}
.tile:hover{border-color:#4a4d55;color:var(--fg)} .tile svg{width:100%;height:44px}
.fsec{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 2px 7px;font-weight:600}
.zoom{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:2px;padding:3px;background:var(--chrome);border:1px solid var(--line);border-radius:9px;z-index:4}
.zoom span{min-width:46px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12.5px;color:var(--muted);background:rgba(22,24,28,.85);border:1px solid var(--line);padding:5px 12px;border-radius:99px;white-space:nowrap;pointer-events:none;z-index:3}
.hint b{color:var(--fg);font-weight:600}
kbd{font:11px/1 "Segoe UI",sans-serif;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--fg);background:var(--raise)}
.banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;background:#1f1a13;border:1px solid var(--accln);border-radius:10px;color:#e9d2b0;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:5;white-space:nowrap;max-width:calc(100% - 24px)}
.banner svg.i{color:var(--acc)} .banner b{color:var(--acc)} .banner span{overflow:hidden;text-overflow:ellipsis}
/* inspector */
.insp{width:300px;flex:none;background:var(--chrome);border-left:1px solid var(--line);overflow:auto}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--chrome);z-index:1}
.tabs button{padding:8px 10px 9px;color:var(--muted);font-weight:600;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 11px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec h4 .sp{flex:1} .sec h4 button{color:var(--muted);font-size:12px;letter-spacing:0;text-transform:none;font-weight:600} .sec h4 button:hover{color:var(--fg)}
.fld{margin-bottom:10px} .fld:last-child{margin-bottom:0} .fld>label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:8px;align-items:center} .row>*{min-width:0}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px} .g4 label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px} .g4 input{padding:5px 6px}
.seg{display:flex;background:var(--paper);border:1px solid var(--line2);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;height:28px;border-radius:5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;white-space:nowrap}
.seg button.on{background:var(--raise);color:var(--fg);box-shadow:0 0 0 1px var(--line2)} .seg button svg.ln{width:26px;height:8px}
.chiprow{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.chiprow .stack{flex:1;display:flex;flex-direction:column;gap:4px} .chiprow input{padding:6px 8px} .chiprow input.subi{font-size:12.5px;color:var(--muted)}
.addl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;padding:4px 2px} .addl:hover{color:var(--fg)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.layer{display:flex;align-items:center;gap:9px;padding:6px 16px;color:var(--muted);cursor:pointer;font-size:13px}
.layer:hover{background:var(--panel);color:var(--fg)} .layer.on{background:var(--raise);color:var(--fg)} .layer .k{margin-left:auto;font-size:11px}
.layer.in{padding-left:34px}
.empty{color:var(--muted);font-size:13px;line-height:1.5}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0} .kv span:first-child{color:var(--muted)}
/* menus, modals, toast */
.menu{position:fixed;min-width:220px;background:var(--chrome);border:1px solid var(--line2);border-radius:10px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:60}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;text-align:left;font-size:13.5px}
.menu button:hover{background:var(--raise)} .menu button small{display:block;color:var(--muted);font-size:12px}
.menu button .kb{margin-left:auto;color:var(--muted);font-size:12px} .menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.menu .mt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:7px 10px 4px;font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(5,6,8,.62);display:grid;place-items:center;z-index:50}
.modal{background:var(--chrome);border:1px solid var(--line2);border-radius:14px;width:min(560px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{width:min(1000px,95vw)} .modal.mid{width:min(760px,95vw)} .modal.nar{width:min(420px,94vw)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 14px 14px 20px;border-bottom:1px solid var(--line)} .mh b{font-size:16px;font-weight:600;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis} .mh .ib,.mh .i{flex:none} .mh .mut{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{padding:18px 20px;overflow:auto} .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;align-items:center}
.mf .left{margin-right:auto;font-size:13px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px}
.cmp figcaption{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:center} .cmp figcaption .mut{font-weight:400}
.cmp svg:not(.i){width:100%;height:auto;display:block}
.changes{margin:12px 0 0;padding:0;list-style:none;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.changes li{color:var(--muted)} .changes li b{color:var(--fg);font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.ph .mb.cf{display:flex;flex-direction:column} .ph .mb.cf .opts{order:1;margin:0 0 16px} .ph .mb.cf .cmp{order:2}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line2);border-radius:10px;cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:#4a4d55} .opt.on{border-color:var(--fg);background:var(--panel)}
.opt .rd{width:16px;height:16px;border-radius:50%;border:1.6px solid var(--muted);flex:none;margin-top:2px;display:grid;place-items:center}
.opt.on .rd{border-color:var(--fg)} .opt.on .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--fg)}
.opt b{font-weight:600} .opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.rec{font-size:11px;color:var(--ok);border:1px solid #4b5a48;border-radius:99px;padding:1px 7px;margin-left:6px;font-weight:600}
.linkrow{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;background:var(--paper);border:1px solid var(--line2);border-radius:8px;margin-top:6px;font-family:Consolas,monospace;font-size:13px}
.linkrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5} .note.a{color:#e9d2b0;background:var(--accbg);border:1px solid var(--accln);padding:8px 10px;border-radius:8px}
.lbl{font-size:12px;color:var(--muted);margin:14px 0 2px} .lbl:first-child{margin-top:0}
.hist{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0} .hist .av{width:32px;height:32px;border-radius:50%;background:var(--raise);display:grid;place-items:center;color:var(--muted);flex:none}
.hist .av.ag{color:var(--acc);background:var(--accbg)} .hist b{font-weight:600} .hist .mut{font-size:12.5px} .hist .cur{font-size:12px;color:var(--ok)}
.sw{width:36px;height:20px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.15s}
.sw.on{background:var(--fg)} .sw.on::after{left:19px;background:#16181c}
.tog{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left} .tog small{display:block;color:var(--muted);font-size:12.5px}
.statusbig{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.statusbig .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#1f2a1f;color:var(--ok)} .statusbig.off .ic{background:var(--accbg);color:var(--acc)}
.tpl{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tplc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left}
.tplc:hover{border-color:#4a4d55} .tplc .thumb{padding:8px} .tplc div.t{padding:8px 10px 10px} .tplc b{font-size:13.5px;font-weight:600;display:block} .tplc small{color:var(--muted);font-size:12px}
.tplc.blank .thumb{color:var(--muted);display:grid;place-items:center} .tplc.blank svg.i{width:28px;height:28px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--fg);color:#16181c;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;gap:8px;align-items:center;max-width:92vw}
.pframe{width:440px;height:900px;max-height:86vh;border-radius:38px;border:10px solid #050506;box-shadow:0 0 0 1px #33363d,0 30px 80px rgba(0,0,0,.6);overflow:hidden;background:#000}
.pframe iframe{width:100%;height:100%;border:0;display:block}
/* ---------- Android (phone) ---------- */
.ph{font-size:15px}
.ph input,.ph textarea,.ph select{font-size:16px;padding:10px 12px;border-radius:10px}
.sbar{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;font-weight:600;background:var(--chrome)}
.sbar svg{width:15px;height:15px;fill:var(--fg)} .sbar .r{display:flex;gap:6px;align-items:center}
.pbar{height:58px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 18px;background:var(--chrome)}
.pbar.ed{padding:0 6px;border-bottom:1px solid var(--line)}
.pbar .ib{width:44px;height:44px;border-radius:50%} .pbar .ib svg.i{width:22px;height:22px}
.ptitle{font-size:22px;font-weight:600}
.ptbtn{flex:1;min-width:0;text-align:left;padding:4px 6px;border-radius:8px} .ptbtn b{display:block;font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .ptbtn span{font-size:12.5px;color:var(--muted)}
.pscroll{flex:1;overflow:auto;padding-bottom:150px}
.psearch{margin:4px 16px 12px;height:50px;border-radius:25px;background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--muted)}
.psearch input{border:0;background:transparent;padding:0}

.ptools button svg.i{width:22px;height:22px} .ptools button.on{background:var(--raise);color:var(--fg)} .ptools button.dn{color:var(--bad)}
.ptools button:disabled{opacity:.35}
.psheet{position:absolute;left:0;right:0;bottom:0;max-height:58%;display:flex;flex-direction:column;background:var(--chrome);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;z-index:20;box-shadow:0 -14px 40px rgba(0,0,0,.45)}

.psheet .sh::before,.ph .modal::before{content:"";position:absolute;top:7px;left:50%;width:36px;height:4px;border-radius:2px;background:#4a4d55;transform:translateX(-50%)}

.ph .sec{padding:12px 20px} .ph .seg button{height:36px;font-size:14px}

.oitem .k.a{border-color:var(--accln);color:var(--acc);background:var(--accbg)} .oitem b{font-weight:600;font-size:15px;display:block} .oitem span{font-size:13px;color:var(--muted)}
.oitem .tx{flex:1;min-width:0} .oitem .tx>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oitem.on{background:var(--raise)}
.ph .scrim{place-items:end stretch}
.ph .modal{width:100%!important;max-width:none;border-radius:22px 22px 0 0;max-height:90vh;border-bottom:0;position:relative}
.ph .mh{padding:24px 14px 12px 20px} .ph .mh .mut{display:none} .ph .mb{padding:14px 20px} .ph .mf{padding:12px 16px 26px}
.ph .mf .btn{height:44px;padding:0 18px;border-radius:12px;font-size:15px}
.ph .cmp{grid-template-columns:minmax(0,1fr)} .ph .modal{overflow:hidden} .ph .mb{min-width:0} .ph .changes{grid-template-columns:1fr}
.ph .tpl{grid-template-columns:1fr 1fr}

.ph .toast{bottom:110px}

/* ===== renderer: architecture-diagram skill style ===== */

let uidN=0;
function T(x,y,t,sz=13,fill='currentColor',ex=''){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${sz}" fill="${fill}" stroke="none"${ex}>${esc(t)}</text>`}
function TS(x,y,t,sz=13,fill='currentColor',anc='start',ex=''){return `<text x="${x}" y="${y}" text-anchor="${anc}" font-size="${sz}" fill="${fill}" stroke="none"${ex}>${esc(t)}</text>`}
const FW=' font-weight="600"';
function mk(id,c){return `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${c}" stroke="none"/></marker>`}
function crow(id,c){return `<marker id="${id}" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 8L15 1.5M2 8L15 14.5M2 8H15" stroke="${c}" stroke-width="1.5" fill="none"/></marker>`}
function chipsNeed(n){let y=(n.s?70:58);(n.chips||[]).forEach(c=>y+=(c[1]?52:36)+10);if((n.items||[]).length)y+=(n.chips?.length?14:(n.s?20:12))+n.items.length*26;return y+6}

// Box-like title, subtitle, chips and list items, using the skill's exact offsets.
function boxText(n,tf){
  const cx=n.x+n.w/2,ch=n.chips||[],it=n.items||[];let s='';
  if(ch.length||it.length){
    s+=T(cx,n.y+36,n.t,17,tf,FW); if(n.s) s+=T(cx,n.y+56,n.s,12,MU);
    let y=n.y+(n.s?70:58);
    ch.forEach(c=>{const h=c[1]?52:36;s+=`<rect x="${n.x+22}" y="${y}" width="${n.w-44}" height="${h}" rx="5" stroke-width="1"/>`;
      if(c[1]){s+=T(cx,y+22,c[0]);s+=T(cx,y+40,c[1],12,MU)}else s+=T(cx,y+23,c[0]);y+=h+10});
    const iy=ch.length?y+14:n.y+(n.s?90:70);
    if(it.length) s+=`<g font-size="13" fill="currentColor" stroke="none" text-anchor="middle">${it.map((t,i)=>`<text x="${cx}" y="${iy+i*26}">${esc(t)}</text>`).join('')}</g>`;
  } else if(n.s){const ty=n.y+n.h/2-12+(100-n.h)*.3;s+=T(cx,ty,n.t,17,tf,FW);s+=T(cx,ty+26,n.s,13,MU)}
  else s+=T(cx,n.y+n.h/2+6,n.t,17,tf,FW);
  return s;
}
function nodeSVG(n){
  const a=n.a,st=a?` stroke="${AC}" stroke-dasharray="7 5"`:'',tf=a?AC:'currentColor',cx=n.x+n.w/2,cy=n.y+n.h/2;let s='';
  switch(n.k){
  case 'box':case 'state':case 'pill':{const rx=n.k=='box'?8:n.k=='state'?18:n.h/2;
    s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${rx}" fill="${BX}" stroke-width="1.5"${st}/>`+boxText(n,tf);break}
  case 'diamond':s+=`<polygon points="${cx},${n.y} ${n.x+n.w},${cy} ${cx},${n.y+n.h} ${n.x},${cy}" fill="${BX}" stroke-width="1.5"${st}/>`;
    s+=n.s?T(cx,cy-3,n.t,15,tf,FW)+T(cx,cy+17,n.s,12,MU):T(cx,cy+5,n.t,15,tf,FW);break;
  case 'cyl':{const r=12,rx=n.w/2;s+=`<path d="M${n.x} ${n.y+r} A${rx} ${r} 0 0 1 ${n.x+n.w} ${n.y+r} V${n.y+n.h-r} A${rx} ${r} 0 0 1 ${n.x} ${n.y+n.h-r} Z" fill="${BX}" stroke-width="1.5"${st}/><path d="M${n.x} ${n.y+r} A${rx} ${r} 0 0 0 ${n.x+n.w} ${n.y+r}" stroke-width="1.5"${st}/>`;
    s+=n.s?T(cx,cy+4,n.t,17,tf,FW)+T(cx,cy+26,n.s,12,MU):T(cx,cy+12,n.t,17,tf,FW);break}
  case 'table':s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8" fill="${BX}" stroke-width="1.5"${st}/>`+T(cx,n.y+29,n.t,16,tf,FW);
    s+=`<line x1="${n.x}" y1="${n.y+44}" x2="${n.x+n.w}" y2="${n.y+44}" stroke-width="1" stroke-opacity=".45"${a?` stroke="${AC}"`:''}/>`;
    (n.items||[]).forEach((r,i)=>{const [nm,ty]=r.split('|');const y=n.y+66+i*26;s+=TS(n.x+20,y,nm)+TS(n.x+n.w-20,y,ty||'',12,MU,'end')});break;
  case 'life':s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="50" rx="8" fill="${BX}" stroke-width="1.5"${st}/>`+T(cx,n.y+31,n.t,15,tf,FW);
    s+=`<line x1="${cx}" y1="${n.y+52}" x2="${cx}" y2="${n.y+n.h}" stroke="${MU}" stroke-width="1" stroke-dasharray="2 5" stroke-opacity=".8"/>`;break;
  case 'zone':s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10" stroke-width="1"${a?` stroke="${AC}" stroke-dasharray="7 5"`:' stroke-opacity=".5"'}/>`+TS(n.x+16,n.y+26,n.t,13,a?AC:MU,'start',FW);
    s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10" stroke="transparent" stroke-width="12" fill="none"/><rect x="${n.x}" y="${n.y}" width="${Math.min(n.w,260)}" height="38" fill="transparent" stroke="none"/>`;break;
  case 'lane':s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" stroke-width="1" stroke-opacity=".45"/><line x1="${n.x+40}" y1="${n.y}" x2="${n.x+40}" y2="${n.y+n.h}" stroke-width="1" stroke-opacity=".45"/>`;
    s+=`<text transform="translate(${n.x+25} ${cy}) rotate(-90)" text-anchor="middle" font-size="13" font-weight="600" fill="${MU}" stroke="none">${esc(n.t)}</text><rect x="${n.x}" y="${n.y}" width="40" height="${n.h}" fill="transparent" stroke="none"/><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" stroke="transparent" stroke-width="10" fill="none"/>`;break;
  case 'room':s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" fill="${BX}" stroke-width="2"/>`+T(cx,cy-3,n.t,15,'currentColor',FW)+(n.s?T(cx,cy+17,n.s,12,MU):'');break;
  case 'item':s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="3" stroke-width="1"${a?` stroke="${AC}" stroke-dasharray="5 4"`:' stroke-opacity=".7"'}/>`+T(cx,cy+4,n.t,12,a?AC:MU);break;
  case 'door':{const d=n.d||1,w=n.w,x=n.x,y=n.y,h=n.o!='v';const C=h?[x+w,y]:[x,y+w],O=h?[x,y+d*w]:[x+d*w,y];const sw=(h==(d>0))?1:0;
    s+=`<line x1="${x}" y1="${y}" x2="${C[0]}" y2="${C[1]}" stroke="${BX}" stroke-width="4"/><line x1="${x}" y1="${y}" x2="${O[0]}" y2="${O[1]}" stroke-width="1.5"/><path d="M${C[0]} ${C[1]} A${w} ${w} 0 0 ${sw} ${O[0]} ${O[1]}" stroke="${MU}" stroke-width="1" stroke-dasharray="3 3"/>`;
    s+=`<rect x="${Math.min(x,O[0],C[0])}" y="${Math.min(y,O[1],C[1])}" width="${w}" height="${w}" fill="transparent" stroke="none"/>`;break}
  case 'dim':s+=`<line x1="${n.x}" y1="${n.y+8}" x2="${n.x+n.w}" y2="${n.y+8}" stroke="${MU}" stroke-width="1"/><line x1="${n.x}" y1="${n.y+2}" x2="${n.x}" y2="${n.y+14}" stroke="${MU}"/><line x1="${n.x+n.w}" y1="${n.y+2}" x2="${n.x+n.w}" y2="${n.y+14}" stroke="${MU}"/>`;
    s+=`<rect x="${cx-34}" y="${n.y}" width="68" height="16" fill="${PA}" stroke="none"/>`+T(cx,n.y+12,n.t,12,MU)+`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="16" fill="transparent" stroke="none"/>`;break;
  case 'dot':s+=`<circle cx="${cx}" cy="${cy}" r="${n.w/2}" fill="${FG}" stroke="none"/>`;break;
  case 'bar':s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="5" fill="${BX}" stroke-width="1"${st}/>`+TS(n.x+12,cy+5,n.t,13,tf);break;

/* Every user change goes through mut() (undo + sync). Live text typing coalesces into one undo step. */
function mut(label,fn,keepSel){const b=snapState();fn();S.undo.push(b);S.redo=[];changed(label);refresh(keepSel)}
function changed(label){
  const d=D();d.ago='just now';d.by=devName();
  if(!S.hub||d.local&&!S.hub){d.pending++;d.pendingList.push(label);if(!d.base)d.base=clone({nodes:d.base0?.nodes||d.nodes,edges:d.edges});renderSync();return}
  S.saving=true;renderSync();clearTimeout(S.saveT);
  S.saveT=setTimeout(()=>{const d=D();if(!d){S.saving=false;return}if(d.local){d.local=0;d.pending=0;d.pendingList=[]}d.rev++;d.hist.unshift({rev:d.rev,by:devName(),ago:'just now',what:label});S.saving=false;renderSync()},750);
}
function undo(){if(!S.undo.length)return toast('Nothing to undo');S.redo.push(snapState());restore(S.undo.pop());changed('Undo');refresh()}
function redo(){if(!S.redo.length)return;S.undo.push(snapState());restore(S.redo.pop());changed('Redo');refresh()}

/* ===== pointer + gestures ===== */
let P=null,spaceDown=false,lastTap={t:0,id:null};const ptrs=new Map();

const UI_SEL='.rail,.zoom,.flyout,.ptools,.vseg,.banner,.psheet,.outline,.paper h1,.paper .sub,.paper .cap';
function onDown(e){

  if(hEl){const n=N(S.sel[0]);P={k:'rs',h:hEl.dataset.h,p,o:{x:n.x,y:n.y,w:n.w,h:n.h},n,b:snapState()};return}

    if(e.shiftKey)S.sel=S.sel.includes(id)?S.sel.filter(x=>x!=id):[...S.sel,id];else if(!S.sel.includes(id))S.sel=[id];

function onMove(e){

    const wx=(P.m0[0]-r.left-P.px)/P.z0,wy=(P.m0[1]-r.top-P.py)/P.z0;S.z=nz;S.px=m[0]-r.left-wx*nz;S.py=m[1]-r.top-wy*nz;applyView();return}

// The Hub's version during a conflict = the pre-offline base plus an edit made on the PC.
function hubVersion(d){const h=clone(d.base);const n=h.nodes.find(n=>n.id=='backend')||h.nodes.find(n=>n.s&&n.k=='box')||h.nodes.find(n=>n.t);
  if(n){if(n.id=='backend')n.s='web service, any engine';else n.s=(n.s?n.s+' ':'')+'(edited on PC)'}return {h,id:n?.id}}
function diffIds(a,b){const out=[];const m=Object.fromEntries(a.nodes.map(n=>[n.id,JSON.stringify(n)]));b.nodes.forEach(n=>{if(m[n.id]!==JSON.stringify(n))out.push(n.id)});return out}
function diffList(base,v){const bm=Object.fromEntries(base.nodes.map(n=>[n.id,n]));const out=[];
  v.nodes.forEach(n=>{const o=bm[n.id];if(!o)out.push(['Added',n.t||KLBL[n.k]]);else if(JSON.stringify(o)!==JSON.stringify(n)){const what=o.t!==n.t?'Renamed':o.s!==n.s?'Subtitle':o.x!==n.x||o.y!==n.y?'Moved':'Edited';out.push([what,n.t||KLBL[n.k]])}});
  base.nodes.forEach(n=>{if(!v.nodes.find(x=>x.id==n.id))out.push(['Removed',n.t||KLBL[n.k]])});
  const be=Object.fromEntries(base.edges.map(e=>[e.id,JSON.stringify(e)]));v.edges.forEach(e=>{if(!be[e.id])out.push(['Connected',e.l||'new link']);else if(be[e.id]!==JSON.stringify(e))out.push(['Connection',e.l||'link'])});return out}
function openConflict(){const d=D(),{h}=hubVersion(d),mine={nodes:d.nodes,edges:d.edges};

  openModal(`<div class="mh">${ic('info','acc')}<b>This diagram changed in two places</b><div class="sp"></div><button class="ib" data-a="closeModal">${ic('x')}</button></div>
  <div class="mb cf"><p class="mut" style="margin:0 0 14px">While ${S.ph?'this phone':'this device'} was offline you made ${d.pending} change${d.pending>1?'s':''}. Meanwhile the PC saved r${d.rev+1} to the Hub. Nothing is lost until you choose.</p>

   <figure><figcaption>${ic('cloud')}On the Hub <span class="mut">· r${d.rev+1} from the PC</span></figcaption>${svgDoc(hubD,{hl:diffIds(d.base,h),bg:1})}<ul class="changes" style="grid-template-columns:1fr">${ch.map(c=>`<li><b>${c[0]}</b> · ${esc(c[1])}</li>`).join('')}</ul></figure></div>
   <div class="opts">${[['both','Keep both','The Hub version stays here. Your edits are saved as a separate copy you can merge by hand.',1],['mine','Use mine','Your version becomes r'+(d.rev+2)+'. The PC change is kept in history.'],['hub',"Use the Hub's",'Your '+d.pending+' offline change'+(d.pending>1?'s are':' is')+' discarded.']].map(([v,t,s,r])=>`<button class="opt ${S.choice==v?'on':''}" data-a="choice" data-v="${v}"><span class="rd"></span><span><b>${t}</b>${r?'<span class="rec">Recommended</span>':''}<small>${s}</small></span></button>`).join('')}</div></div>
  <div class="mf"><span class="left desk-only">Highlighted shapes are the ones that differ.</span><button class="btn" data-a="closeModal">Decide later</button><button class="btn pri" data-a="resolve">Apply</button></div>`,'wide')}

/* ===== hash scenarios for screenshots ===== */
function scenario(){const s=(location.hash.match(/s=([^&]+)/)||[])[1];if(!s){render();return}
  const arch='dgm_7c42',[name,arg]=s.split(':');
  if(name=='lib'){render();return}
  if(name=='new'){render();openNew();return}
  openDoc(name=='ed'?arg:arch);const d=D();
  const after=fn=>setTimeout(fn,60);
  if(name=='sel'){S.sel=['match'];refresh()}
  if(name=='multi'){S.sel=['platform','client'];refresh()}
  if(name=='shapes'){S.flyout=true;rerender()}
  if(name=='edge'){S.selE='e4';refresh()}
  if(name=='offline'){S.hub=false;offlineEdits();S.sel=['match'];rerender()}
  if(name=='conflict'){S.hub=false;offlineEdits();S.conflictSim=true;goOnline()}
  if(name=='agent'){S.props[arch]=makeProposal(d);rerender()}
  if(name=='diff'){S.props[arch]=makeProposal(d);rerender();openDiff()}
  if(name=='share')openShare('link');
  if(name=='handoff')openShare('agent');
  if(name=='history')openHistory();
  if(name=='sync')openSync();
  if(name=='export')after(()=>A.export($('[data-a="export"]')));
  if(name=='sheet'){S.sel=['match'];after(()=>openSheet())}
  if(name=='esheet'){S.selE='e4';after(()=>openSheet())}
  if(name=='zoom'){S.sel=['match'];after(()=>{focusNode(N('match'),.62,.45);renderInsp()})}
  if(name=='outline'){S.outline=true;rerender()}
  if(name=='add'){after(()=>A.flyout())}
}
